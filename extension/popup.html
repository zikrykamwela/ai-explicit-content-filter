<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearView</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">CV</span>
      <div>
        <h1>ClearView</h1>
        <p>Browser content filter</p>
      </div>
    </header>

    <label class="switch-row" for="enabled">
      <span>Protection</span>
      <input id="enabled" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="field" for="api-url">
      <span>Prediction service</span>
      <input id="api-url" type="url" placeholder="http://localhost:8000/api/predict">
    </label>
    <button id="save" type="button">Save settings</button>
    <p id="status" role="status"></p>
    <p class="note">The local Flask service must be running. Only images in browser pages are checked.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
